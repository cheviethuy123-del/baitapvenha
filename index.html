<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn từ vựng tiếng Anh lớp 3</title>
<style>
:root{color-scheme:light;--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--mut:#6b6b6b;--pri:#ff7a3d;--ok:#2e9e5b;--okbg:#dff5e7;--bad:#d64545;--badbg:#fde3e3;--bd:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1e1b16;--card:#2a2620;--ink:#f3eee4;--mut:#b5ab99;--pri:#ff8f5a;--ok:#5fd08a;--okbg:#1f3a2a;--bad:#ff7b7b;--badbg:#412325;--bd:#4a4234}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1e1b16;--card:#2a2620;--ink:#f3eee4;--mut:#b5ab99;--pri:#ff8f5a;--ok:#5fd08a;--okbg:#1f3a2a;--bad:#ff7b7b;--badbg:#412325;--bd:#4a4234}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:20px;text-align:center}
h1{font-size:1.6rem;margin:.2em 0}
.mut{color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.emoji{font-size:5.5rem;line-height:1.1}
.word{font-size:2.4rem;font-weight:700;margin:.1em 0}
.sent{font-size:1.2rem;margin:.4em 0 .8em}
.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--ink);padding:12px 16px}
.snd{border-radius:999px;padding:8px 14px;font-size:1.1rem}
.primary{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700;font-size:1.2rem;padding:12px 28px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.25rem;padding:14px}
.opt b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--bd);align-items:center;justify-content:center;flex:none}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.msg{min-height:1.6em;font-weight:700;margin:12px 0 6px}
.big{font-size:3rem}
ul{text-align:left;padding-left:20px}
</style>
</head>
<body>
<main><div id="app"></div></main>
<script>
var Q=[
["must","❗","I must go home.",["phải","có thể","muốn"]],
["active","🏃","He is very active.",["năng động","lười biếng","buồn ngủ"]],
["basketball","🏀","I play basketball.",["bóng rổ","bóng đá","bóng bàn"]],
["curly hair","👩‍🦱","She has curly hair.",["tóc xoăn","tóc thẳng","tóc ngắn"]],
["funny","😂","He is funny.",["hài hước","nghiêm túc","xấu hổ"]],
["letter","✉️","I write a letter.",["lá thư","quyển sách","cái bút"]],
["club","👥","I join the club.",["câu lạc bộ","lớp học","thư viện"]],
["parents","👨‍👩‍👧","I love my parents.",["ba mẹ","ông bà","anh chị"]],
["English","🇬🇧","I like English.",["tiếng Anh","tiếng Việt","tiếng Trung"]],
["weekend","📅","I rest at the weekend.",["cuối tuần","buổi sáng","ngày mai"]],
["can","💪","I can swim.",["có thể","phải","không thích"]],
["tall","🦒","My dad is tall.",["cao","thấp","béo"]],
["ice cream","🍦","I eat ice cream.",["kem","bánh mì","sữa"]],
["homework","📝","I do my homework.",["bài tập về nhà","đồ chơi","bữa trưa"]],
["everything","🌍","I know everything.",["mọi thứ","không có gì","một chút"]],
["blonde","👱","She has blonde hair.",["tóc vàng","tóc đen","tóc đỏ"]],
["read","📖","I read a book.",["đọc","viết","vẽ"]]
];
var app=document.getElementById("app"),order,i,score,miss,locked;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function start(){order=shuffle(Q);i=0;score=0;miss=[];show()}
function home(){app.innerHTML='<div class="card"><div class="emoji">📚</div><h1>Ôn từ vựng tiếng Anh</h1><p class="mut">17 từ • Nhìn hình, nghe âm thanh và chọn nghĩa tiếng Việt</p><p><button class="primary" id="go">Bắt đầu</button></p><p class="mut">Bật loa để nghe phát âm nhé! 🔊</p></div>';
document.getElementById("go").onclick=start}
function show(){
locked=false;var q=order[i],opts=shuffle(q[3]);
var h='<div class="mut">Câu '+(i+1)+'/'+order.length+' • Điểm: '+score+'</div><div class="bar"><i style="width:'+(i/order.length*100)+'%"></i></div><div class="card">';
h+='<div class="emoji">'+q[1]+'</div><div class="row"><span class="word">'+q[0]+'</span><button class="snd" id="s1" aria-label="Nghe từ">🔊</button></div>';
h+='<div class="row"><span class="sent">'+q[2]+'</span><button class="snd" id="s2" aria-label="Nghe câu">🔊</button></div>';
h+='<div class="mut">Từ này nghĩa là gì?</div><div class="opts">';
opts.forEach(function(o,n){h+='<button class="opt" data-o="'+o+'"><b>'+"ABC"[n]+'</b>'+o+'</button>'});
h+='</div><div class="msg" id="msg"></div><div id="nx"></div></div>';
app.innerHTML=h;
document.getElementById("s1").onclick=function(){speak(q[0])};
document.getElementById("s2").onclick=function(){speak(q[2])};
Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(b,q)}});
setTimeout(function(){speak(q[0])},300)}
function pick(b,q){
if(locked)return;locked=true;var right=q[3][0],ok=b.getAttribute("data-o")===right;
Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(x){if(x.getAttribute("data-o")===right)x.className+=" ok"});
var m=document.getElementById("msg");
if(ok){score++;m.textContent="🎉 Giỏi lắm!";m.style.color="var(--ok)"}
else{b.className+=" bad";miss.push(q);m.textContent="Đáp án đúng: "+right;m.style.color="var(--bad)"}
var last=i===order.length-1;
document.getElementById("nx").innerHTML='<button class="primary" id="n">'+(last?"Xem kết quả":"Câu tiếp theo ➜")+'</button>';
document.getElementById("n").onclick=function(){i++;last?end():show()}}
function end(){
var h='<div class="card"><div class="big">'+(score>=15?"🏆":score>=10?"⭐":"💪")+'</div><h1>'+score+' / '+order.length+'</h1><p>'+(score>=15?"Xuất sắc!":score>=10?"Làm tốt lắm!":"Cố gắng thêm nhé!")+'</p>';
if(miss.length){h+='<p class="mut">Các từ cần ôn lại:</p><ul>';miss.forEach(function(q){h+='<li>'+q[1]+' <b>'+q[0]+'</b> = '+q[3][0]+'</li>'});h+='</ul>'}
h+='<p><button class="primary" id="again">Làm lại</button></p></div>';
app.innerHTML=h;document.getElementById("again").onclick=start}
home();
</script>
</body>
</html>
